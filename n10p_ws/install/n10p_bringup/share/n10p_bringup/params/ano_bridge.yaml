/ano_bridge_node:
  ros__parameters:
    serial_port: /dev/ttyUSB0                  # USB-TTL 转飞控串口 (CH340)
    baud_rate: 500000                          # 凌霄飞控波特率 (实测 500k)
    frame_id: base_link                 # 无人机机体坐标系
    odom_frame_id: odom                 # 里程计坐标系
    publish_tf: true                    # 是否发布 odom → base_link TF
    pub_rate: 160.0                     # 里程计发布频率 (Hz), 实测上限 ~163Hz
    acc_scale: 0.004788                 # 加速度计 LSB → m/s² (±16g)
    gyr_scale: 0.001065                 # 陀螺仪 LSB → rad/s (±2000dps)
    gyr_offset_x: 0.0                   # 陀螺仪 X 轴零偏补偿
    gyr_offset_y: 0.0
    gyr_offset_z: 0.0
