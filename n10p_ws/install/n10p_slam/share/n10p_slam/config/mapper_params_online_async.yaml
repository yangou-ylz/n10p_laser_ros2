# N10P SLAM 建图配置 — slam-toolbox Online Async
# 适配: 镭神 N10P 单线激光雷达 (360°, 10Hz, 0.02-12m, ~530点/帧)

slam_toolbox:
  ros__parameters:

    # ── 模式 ──────────────────────────────────────
    mode: mapping                              # 建图模式 (mapping / localization)

    # ── 坐标系 ──────────────────────────────────
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true                        # 启用 map_saver 服务

    # ── 地图 ────────────────────────────────────
    map_resolution: 0.05                       # 地图分辨率 (m)
    map_start_pose: [0.0, 0.0, 0.0]           # 地图原点
    map_update_interval: 3.0                   # 地图更新间隔 (s)
    max_laser_range: 12.0                      # 最大激光距离 (N10P 实际量程)
    minimum_laser_range: 0.3                   # 30cm 内为无人机机身

    # ── 扫描匹配 ────────────────────────────────
    minimum_travel_distance: 0.0               # 手持建图: 每帧都处理
    minimum_travel_heading: 0.0                # 手持建图: 不依赖里程计转角
    scan_buffer_size: 10
    scan_buffer_max_scan_time: 10.0            # 缓冲区最大扫描时间 (s)
    link_match_min_response_fine: 0.1
    link_scan_maximum_distance: 3.0            # 增大帧间匹配距离 (原1.5→3.0, 手持可快步走)
    loop_search_maximum_distance: 8.0          # 增大回环搜索距离 (原5.0→8.0)
    do_loop_closing: true                      # 启用回环检测
    loop_match_min_chain_size: 10
    loop_match_max_variance_coarse: 3.0
    loop_match_min_response_coarse: 0.35
    loop_match_min_response_fine: 0.45

    # ── 相关性扫描匹配器 ────────────────────────
    # dimension: 搜索窗口大小 (米+弧度)。手持无飞控里程计→需要大窗口
    # 0.5 = ±28°旋转搜索 → 手持旋转建图不够 → 增大到1.5 = ±86°
    correlation_search_space_dimension: 1.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ── 求解器 ──────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_diagonal_type: CLUSTERED
    ceres_loss_function: None
    ceres_num_threads: 2                        # 树莓派4核, 留2核给driver/imu_filter/TF
    ceres_max_num_iterations: 20

    # ── 地图保存 ────────────────────────────────
    map_file_name: /home/ylz/n10p_leishen/maps/n10p_map
    map_save_mode: 0                           # 0: 完整保存, 1: 仅保存变更
