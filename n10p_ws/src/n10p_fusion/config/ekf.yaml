# N10P IMU 互补滤波器配置 — n10p_imu_filter 节点
# =================================================================
# 替代 robot_localization EKF (ARM64 有 NaN bug)
# 算法: 互补滤波 — 高频用 IMU 陀螺仪积分, 低频用飞控四元数修正
# =================================================================

imu_filter_node:
  ros__parameters:

    # ── 滤波参数 ──────────────────────────────────
    alpha_orientation: 0.02          # 互补系数
                                     # 0.0 = 全信 IMU 陀螺仪积分 (高频好, 但会漂)
                                     # 1.0 = 全信飞控四元数 (不漂, 但有噪声)
                                     # 0.02 = 每帧 2% 来自飞控修正, 98% 来自陀螺仪积分

    publish_rate: 100.0              # 发布频率 Hz (匹配 IMU 速率)
    publish_tf: true                 # 发布 odom→base_link TF
