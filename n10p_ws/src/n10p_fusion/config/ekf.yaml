# N10P IMU 互补滤波器配置 — n10p_imu_filter 节点
# =================================================================
# 替代 robot_localization EKF (ARM64 有 NaN bug)
# 算法: 互补滤波 — 高频用 IMU 陀螺仪积分, 低频用飞控四元数修正
# =================================================================

imu_filter_node:
  ros__parameters:

    # ── 滤波参数 ──────────────────────────────────
    alpha_orientation: 0.02          # 姿态互补系数 (基础值, 实际由自适应算法动态调整)
    alpha_velocity: 0.05             # 速度互补系数 (0=全信IMU积分, 1=全信飞控速度)
    publish_rate: 50.0               # 发布频率 Hz (与ano_bridge对齐)
    publish_tf: true                 # 发布 odom→base_link TF
