# N10P 无人机 Nav2 导航参数
# 适配: 360° LiDAR (10Hz, 0.02-12m), 全向运动 (无人机)

# ══════════════════════════════════════════════════
# AMCL — 自适应蒙特卡洛定位
# ══════════════════════════════════════════════════
amcl:
  ros__parameters:
    # 坐标系
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: /scan

    # 全向运动模型 (无人机可在任意方向平移)
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # 激光模型
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0          # N10P 最大量程
    laser_min_range: 0.02          # N10P 最小量程
    max_beams: 60                  # 增加扫描点 (30→60, 提高匹配特征密度)
    laser_likelihood_max_dist: 1.5    # 扩大到1.5m (给粒子更宽的似然吸引区)

    # 粒子滤波器
    max_particles: 1000            # 1000粒子加速初始收敛
    min_particles: 100
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    alpha_slow: 0.1               # 10%慢速随机注入 (飞行需更多探索防AMCL僵死)
    alpha_fast: 0.3               # 30%快速随机注入 (加速初始收敛)

    # ── 自动初始位姿 (比赛模式，无需手点RViz) ──
    # 无人机固定在起飞点启动，设为地图原点附近。AMCL 启动时自动从此位置开始搜索。
    # 校准方法: 先用手持建图确定起飞点在地图中的坐标，然后填入下面的 initial_pose。
    set_initial_pose: true
    initial_pose:
      x: 0.0                       # 起飞点在地图中的X坐标 (m)
      y: 0.0                       # 起飞点在地图中的Y坐标 (m)
      z: 0.0
      yaw: 0.0                     # 起飞时机头朝向 (rad, 0=map的+X方向)

    # 更新阈值
    update_min_d: 0.01             # 平移 1cm 触发 (更高实时性,配合FC速度死区)
    update_min_a: 0.01             # 旋转 0.57° 触发 (更高实时性)
    transform_tolerance: 0.5

    # 似然场参数
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.4                  # 似然场高斯σ=0.4m (配合likelihood_max_dist=1.0, 扩大粒子吸引范围)

    # 如果初始位姿不准，AMCL 需快速恢复 — 增大快速恢复权重
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.8       # 原0.5→0.8，检测到失锁时80%粒子随机注入
    tf_broadcast: true

# ══════════════════════════════════════════════════
# Map Server — 加载静态地图
# ══════════════════════════════════════════════════
map_server:
  ros__parameters:
    yaml_filename: "/home/ylz/n10p_leishen/maps/n10p_map.yaml"
    use_sim_time: false

# ══════════════════════════════════════════════════
# Planner Server — 全局路径规划 (Hybrid-A*)
# ══════════════════════════════════════════════════
planner_server:
  ros__parameters:
    transform_tolerance: 0.2    # 容忍 Pi 和电脑之间的 NTP 残余偏差 (ms 级)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

      # 8 方向搜索 (全向无人机无需转弯半径约束)
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 72   # 360°/72=5° 分辨率

      tolerance: 0.25                # 目标点容差 (m)
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: false           # 不穿过未知区域
      max_iterations: 100000
      max_on_approach_iterations: 1000
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: true
      minimum_turning_radius: 0.0    # 全向运动无转弯半径
      lookup_table_size: 20.0

# ══════════════════════════════════════════════════
# Controller Server — 局部路径跟踪 (Regulated Pure Pursuit)
# ══════════════════════════════════════════════════
controller_server:
  ros__parameters:
    transform_tolerance: 0.2    # 容忍 Pi 和电脑之间的 NTP 残余偏差
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.3        # 目标线速度 (m/s)
      lookahead_dist: 0.5            # 前视距离
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_vel: 0.1
      max_allowed_time_to_collision: 1.0
      use_collision_detection: false   # 无人机飞行中无需地面碰撞检测
      transform_tolerance: 0.3

      # 目标收敛
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3

      # 速度限制 (无人机全向)
      max_linear_vel: 0.5
      min_linear_vel: 0.05
      max_angular_vel: 1.0
      min_angular_vel: 0.01

      # 不限制旋转到目标
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.5

# ══════════════════════════════════════════════════
# Behavior Tree Navigator
# ══════════════════════════════════════════════════
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100             # 树莓派: 100ms = 10Hz
    replanning_rate: 0.5              # 重规划频率 Hz，16平静态房无需高频
    default_server_timeout: 20
    wait_for_service_timeout: 5000
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_wait_cancel_bt_node

# ══════════════════════════════════════════════════
# 全局 Costmap (静态地图 + 膨胀)
# ══════════════════════════════════════════════════
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.15
      resolution: 0.05
      transform_tolerance: 1.0    # TF 时间对准容忍 1 秒
      track_unknown_space: false
      rolling_window: false
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25   # 安全边距 25cm，原 0.5 过大

# ══════════════════════════════════════════════════
# 局部 Costmap (滚动窗口 + 膨胀)
# ══════════════════════════════════════════════════
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.15
      resolution: 0.05
      transform_tolerance: 1.0    # TF 时间对准容忍 1 秒
      rolling_window: true
      width: 4
      height: 4
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true   # 清除机器人脚印下的自检障碍
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_range: 0.3     # 30cm 内为无人机机身/安装柱
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25   # 树莓派适配，无人机安全边距
